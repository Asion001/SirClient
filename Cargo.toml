[workspace]
resolver = "3"
members = ["crates/sirclient-core", "crates/sirclient-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Asion001/SirClient"
rust-version = "1.95"

[workspace.dependencies]
sirclient-core = { path = "crates/sirclient-core" }
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
