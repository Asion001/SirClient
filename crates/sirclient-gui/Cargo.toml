[package]
name = "sirclient-gui"
description = "Desktop configurator for GameSir controllers (unofficial)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sirclient"
path = "src/main.rs"

[dependencies]
sirclient-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = { version = "0.9", features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
crossbeam-channel.workspace = true
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# Same winit eframe uses; only for the DWM title bar colour.
winit = { version = "0.30", default-features = false }
